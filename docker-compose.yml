services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: seatreservation
      MYSQL_USER: seatuser
      MYSQL_PASSWORD: seatpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports: ["3306:3306"]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u seatuser -pseatpass --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/seatreservation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionCollation=utf8mb4_0900_ai_ci
      DB_USER: seatuser
      DB_PASSWORD: seatpass
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
