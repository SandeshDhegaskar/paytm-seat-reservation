spring:
  application:
    name: seat-reservation
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/seatreservation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionCollation=utf8mb4_0900_ai_ci}
    username: ${DB_USER:seatuser}
    password: ${DB_PASSWORD:seatpass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 5
      connection-timeout: 3000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  threads:
    virtual:
      enabled: true
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: seat-reservation
logging.structured.format.console: json
server:
  port: ${PORT:8080}
  shutdown: graceful
